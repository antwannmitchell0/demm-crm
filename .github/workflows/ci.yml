name: DEMM CRM Security & Quality CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# T13 DATABASE ISOLATION POLICY
#
# The verification suites are destructive: verify-comprehensive.ts opens with 21
# unscoped deleteMany() calls, and verify-http-staging.ts registers real users.
# They may therefore only ever run against a throwaway database.
#
# Three things enforce that here:
#   1. The Postgres service database is named `demm_crm_ci` -- NOT `demm_crm`.
#      It previously matched the developer's database name exactly, which meant a
#      misconfigured DATABASE_URL pointed a wiping suite at a real database with
#      nothing to stop it.
#   2. DATABASE_URL is set per step and only ever points at that service.
#   3. ALLOW_DESTRUCTIVE_TESTS=true is set ONLY on the verification step, so the
#      backend's live database-name guard (backend/test-db-guard.ts) authorises
#      the run. Without both the name and the opt-in the suites refuse to start.
#
# The service container is created for this job and destroyed with it, so the
# database is ephemeral by construction -- there is nothing to drop.
#
# Staging and production credentials are never referenced by this workflow.

jobs:
  verify:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          # Ephemeral CI database. The `_ci` suffix is what the backend guard
          # recognises as disposable; `demm_crm` is on its deny list.
          POSTGRES_DB: demm_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/demm_crm_ci?schema=public"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Confirm CI is pointed at the ephemeral database
        # Fails the job before anything else runs if the live database is not the
        # isolated CI one. Asks the server via `SELECT current_database()` rather
        # than trusting the URL string.
        #
        # Credentials are passed as PG* environment variables so no connection
        # string ever appears on a command line or in the job log; only the
        # resolved database NAME is printed.
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgrespassword
          PGDATABASE: demm_crm_ci
        run: |
          DB=$(psql -tAc "SELECT current_database()")
          echo "Connected database: $DB"
          if [ "$DB" != "demm_crm_ci" ]; then
            echo "REFUSING: CI is connected to '$DB', not the ephemeral 'demm_crm_ci'."
            exit 1
          fi

      - name: Prisma Validate & Generate
        run: cd backend && npx prisma validate && npx prisma generate

      - name: Apply Migrations (migrate deploy)
        # `prisma migrate deploy` applies committed migrations and nothing else.
        # `db push` was removed: it silently reshapes the database to match the
        # schema without recording a migration, so CI could pass against a shape
        # that no migration produces. `migrate dev` and `migrate reset` are also
        # never used here -- both can drop data and prompt.
        run: cd backend && npx prisma migrate deploy

      - name: Report Migration Status
        # DRIFT TRUTHFULNESS: this confirms the migrations THIS repository knows
        # about are applied. It does NOT prove that no extra migrations were
        # applied from elsewhere (verified in T3.1: a database carrying two
        # unmerged branch migrations still reported "up to date"), and it says
        # nothing about whether the target is safe to destroy. It is reporting,
        # not a safety control. The live database-name guard is the safety
        # control.
        run: cd backend && npx prisma migrate status

      - name: Build Backend
        run: cd backend && npm run build
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"

      - name: Repository & Destructive-Test Safety Suite
        # Read-only: proves the guard refuses unsafe databases and that the
        # repository hygiene fixes from T12R/T14R are still in place.
        run: cd backend && npm run test:repo-safety

      - name: Atomic Refresh Rotation Suite
        # Phase 0C-R. Proves one refresh token cannot be amplified into several
        # live sessions by concurrent callers. Needs a real PostgreSQL instance
        # -- the race cannot be exhibited against a mock -- which is why it runs
        # here rather than in a unit runner.
        run: cd backend && npm run test:refresh-concurrency
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Agent Contract Suite
        # Phase 2. Proves the two fabrications stay deleted (the canned
        # plan/preview and the unconditional "no automations failed" claim),
        # that every agent endpoint validates its body at the boundary instead
        # of binding raw properties past the ValidationPipe, and that the tool
        # registry publishes parameter schemas.
        run: cd backend && npm run test:agent-contract
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Workspace Switching Suite
        # Phase 2. Membership listing and password-free workspace switching.
        # Includes the concurrency check: eight simultaneous switches of one
        # refresh token must produce ONE session, because the switch is built on
        # the same atomic claim as rotation.
        run: cd backend && npm run test:workspace-switching
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Approval Inbox Suite
        # Phase 2. Listing, scoping, filtering and requester cancellation --
        # including that a cancelled request cannot afterwards be approved and
        # that an approver's REJECT cannot be re-labelled as a cancellation.
        run: cd backend && npm run test:approval-inbox
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Invitation Acceptance Suite
        # Proves acceptance is IDEMPOTENT and TERMINAL. Covers both concurrency
        # races: six accepts of ONE invitation, and two DIFFERENT pending
        # invitations for the same user+workspace accepted simultaneously -- the
        # second returned HTTP 500 and left a row stuck at PENDING before the
        # conflict-safe insert.
        run: cd backend && npm run test:invitation-accept
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Invited Registration Suite
        # Atomicity, recovery and concurrency for register-invited. Proves a
        # REVOKED or already-ACCEPTED invitation creates no account, that the
        # user and its audit row commit together or not at all, that a lost
        # response resolves by resubmitting, and that six simultaneous submits
        # yield one account and no 500. TRUSTED_PROXY_HOPS mirrors the
        # deployment so the rate limit is measured per client, not per proxy.
        run: cd backend && npm run test:invited-registration
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Token Purpose Separation Suite
        # Proves a pre-session credential cannot be spent as a session. Before
        # the strategy checked token class, a five-minute workspace-selection
        # token -- issued BEFORE any password was verified -- returned HTTP 200
        # on /team/members, /agent/approvals and /contacts among others.
        run: cd backend && npm run test:token-purpose
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Pre-Session Invitation Suite
        # Proves a person invited to their FIRST workspace can accept, using a
        # capability scoped to one invitation rather than a workspace-less
        # session. Every other invitation suite signs a JWT directly, which
        # bypasses login -- which is exactly where this defect lived.
        run: cd backend && npm run test:invitation-pre-session
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Team Authorization Boundary Suite
        # GATE A. Proves a lower rank cannot demote or remove a higher one.
        # Before this, canGrant() was the only check and demoting is
        # mechanically "granting a lower role", so a WORKSPACE_ADMIN could
        # rewrite an ORG_OWNER to USER (measured: HTTP 200).
        run: cd backend && npm run test:team-authz
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Invitation Migration Data-Preservation Suite
        # GATE B. Builds a database at the PRE-migration schema, seeds real
        # invitations, migrates forward, and accepts one over HTTP with the
        # token issued beforehand. Fails if the migration ever becomes
        # destructive again. Also covers migrate-from-zero.
        #
        # Creates and drops its OWN disposable databases, so it needs createdb
        # rights but not the job's DATABASE_URL.
        run: cd backend && npm run test:invitation-migration
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgrespassword

      - name: Team Management Suite
        # Phase 2. Invitations, member listing, role changes, removal, and the
        # last-owner rule. Includes a genuine concurrency check: three
        # simultaneous owner removals must leave an owner behind. Without the
        # SELECT ... FOR UPDATE serialisation all three succeed and the
        # workspace is orphaned -- verified by removing the lock.
        run: cd backend && npm run test:team
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Focused Security Suites
        # Previously these ran only on a developer's machine. `npm run verify`
        # covers the comprehensive and HTTP suites but NOT approval governance,
        # auth-security, or either workspace-isolation suite, so a regression in
        # any of them could have reached main with CI green.
        run: |
          cd backend
          npm run test:approval
          npm run test:auth-security
          npm run test:workspace-guard
          npm run test:workspace-controller
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

      - name: Execute Verification Suite
        # The ONLY step permitted to authorise destructive tests, and only
        # because the two steps above proved the target is the ephemeral CI
        # database.
        run: cd backend && npm run verify
        env:
          JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"
          ALLOW_DESTRUCTIVE_TESTS: "true"

  # ---------------------------------------------------------------------------
  # FRONTEND
  #
  # The frontend had NO continuous integration at all: the session BFF routes,
  # multi-tab orchestration, workspace selection, and the honest-UI guarantees
  # were only ever verified locally. A regression in any of them could reach
  # main with CI green. This job needs no database -- every suite runs against
  # the built standalone output and stub backends.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Quality & Session Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Install backend toolchain for the TypeScript test runner
        # The frontend suites are executed with the backend's ts-node, matching
        # how they are invoked locally, so that toolchain must exist here too.
        run: cd backend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Typecheck
        run: cd frontend && npm run typecheck

      - name: Production Build (with config and bundle guards)
        # `prebuild` runs verify-production-config and `postbuild` runs
        # verify-no-localhost-in-bundle, so this single step exercises both
        # release guards. A missing or loopback API URL fails the build.
        run: cd frontend && npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: "https://api.ci.invalid"

      - name: Session Route Suite (T7)
        # Requires the standalone build produced by the previous step.
        run: cd frontend && npm run test:session-routes

      - name: Session Orchestration Suite (T8)
        run: cd frontend && npm run test:session-orchestration

      - name: Workspace Selection Suite (T9)
        run: cd frontend && npm run test:workspace-selection

      - name: Honest Frontend Suite (T10/T11)
        run: cd frontend && npm run test:honest-frontend

      - name: Password-Free Workspace Switch Suite
        # Phase 2. Proves switching workspace sends no password, reads the
        # account's memberships with the live access token, and completes
        # through the BFF route that spends the httpOnly refresh cookie
        # server-side.
        run: cd frontend && npm run test:password-free-switch

  # ---------------------------------------------------------------------------
  # BROWSER UAT
  #
  # Drives a REAL production stack in a real browser: the compiled backend
  # (dist/src/main -- what the Dockerfile runs) and a production Next build, so
  # both release guards actually apply. Nothing here touches a development,
  # staging or production database, uses owner credentials, or reaches a real
  # provider.
  # ---------------------------------------------------------------------------
  browser-uat:
    name: Browser UAT
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          # The harness creates its OWN database (demm_crm_uat_verify) and drops
          # it in teardown; this is only the maintenance database it connects to
          # in order to do that.
          POSTGRES_DB: demm_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      JWT_SECRET: "demm_crm_production_secure_jwt_secret_key_32chars_minimum"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Confirm the live database is the ephemeral CI one
        # Asks the server via SELECT current_database() rather than trusting a
        # URL string. Credentials travel as PG* variables so no connection
        # string reaches a command line or the job log.
        env:
          PGDATABASE: demm_crm_ci
        run: |
          DB=$(psql -tAc "SELECT current_database()")
          echo "Connected database: $DB"
          if [ "$DB" != "demm_crm_ci" ]; then
            echo "REFUSING: connected to '$DB', not the ephemeral 'demm_crm_ci'."
            exit 1
          fi

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Prisma generate
        run: cd backend && npx prisma generate

      - name: Build backend
        run: cd backend && npm run build

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend with production guards intact
        # NEXT_PUBLIC_API_URL is a real https origin, NOT localhost, so
        # verify-production-config and verify-no-localhost-in-bundle both pass
        # honestly. Playwright reroutes that origin to the local backend at the
        # network layer, exactly as a reverse proxy would. The guards are never
        # weakened for the test.
        run: cd frontend && npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: "https://backend.uat.invalid"

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Reject disabled critical browser journeys
        # Runs BEFORE Playwright, so a branch that turned a journey off fails
        # here rather than reporting green with the journey silently skipped.
        # That exact thing happened: the invitation journeys shipped as
        # `test.fixme`, Playwright exited 0, and CI was green for a run in which
        # a new teammate joining a workspace was never executed.
        run: cd frontend && npm run verify:journeys

      - name: Run browser UAT
        # global-setup creates demm_crm_uat_verify, applies every migration with
        # `prisma migrate deploy`, and seeds synthetic users, workspaces,
        # approvals and invitations. global-teardown removes them and drops the
        # database. A browser failure fails this job.
        run: cd frontend && npx playwright test

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-uat-evidence
          # Screenshots, traces and the control inventory. fixtures.json is
          # excluded: it carries seeded account identifiers, and an artifact is
          # the wrong place for them even synthetic.
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/e2e-results/button-inventory.json
            frontend/e2e-results/button-inventory.md
          retention-days: 7
          if-no-files-found: ignore
